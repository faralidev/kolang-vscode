name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - name: Fetch data (verify kolang-data is reachable)
        run: node scripts/fetch-data.js
      - name: Verify JSON
        run: |
          node -e "require('./syntaxes/kolang.tmLanguage.json')"
          node -e "require('./snippets/kolang.json')"
      - name: Package extension (dry-run)
        run: npx vsce package --no-dependencies --pre-release || true
