name: Publish to VS Code Marketplace

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      # vscode:prepublish (postinstall) runs fetch-data.js to fetch the latest
      # docs, snippets, and grammar from kolang-data + kolang-grammar at build
      # time — no committed copies, no drift.
      - name: Publish to Marketplace
        run: npx vsce publish --pat ${{ secrets.VSCE_PAT }}
